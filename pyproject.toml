[project]
name = "jobmatch"
version = "0.1.0"
description = "An AI agent that matches a CV against a job ad, with verified evidence for every claim."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.6", "pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jobmatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
